name: Deploy to Masterhost

# Every push also publishes the same build to GitHub Pages, a standby copy that
# serves no one until DNS is switched to it (DEPLOYMENT.md, "Failover to GitHub
# Pages"). Only the Masterhost install sends IndexNow pings.

on:
  push:
    branches: [main]
  # Pull requests only build (to catch errors); they never deploy.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Deploys run one after another (ops/install-release.sh also holds a lock); a
# newer build of the same pull request replaces an older one.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'masterhost' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      standby: ${{ steps.standby.outcome }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # Uploaded before the Masterhost deploy, so the standby is still updated
      # when Masterhost is down. Apache's .htaccess means nothing on Pages.
      - name: Prepare standby copy
        if: github.event_name != 'pull_request'
        run: rsync -a --exclude=.htaccess dist/ "$RUNNER_TEMP/pages/"
      - name: Upload standby copy
        id: standby
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages

      # Only for this job: a deploy key that is allowed into the Masterhost account,
      # pinned to the host's known keys. See DEPLOYMENT.md.
      - name: Configure SSH
        if: github.event_name != 'pull_request'
        env:
          MASTERHOST_SSH_KEY: ${{ secrets.MASTERHOST_SSH_KEY }}
          MASTERHOST_KNOWN_HOSTS: ${{ secrets.MASTERHOST_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$MASTERHOST_SSH_KEY" > ~/.ssh/masterhost
          printf '%s\n' "$MASTERHOST_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host masterhost
            HostName u543238.ssh.masterhost.ru
            User u543238
            IdentityFile ~/.ssh/masterhost
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF
          chmod 600 ~/.ssh/masterhost ~/.ssh/known_hosts ~/.ssh/config

      - name: Deploy
        if: github.event_name != 'pull_request'
        env:
          REVISION: ${{ github.sha }}
        run: ops/deploy.sh

  standby:
    needs: deploy
    if: ${{ !cancelled() && needs.deploy.outputs.standby == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish standby copy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
