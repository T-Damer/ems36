name: Deploy to Masterhost

on:
  push:
    branches: [main]
  # Pull requests only build (to catch errors); they never deploy.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Deploys run one after another (ops/install-release.sh also holds a lock); a
# newer build of the same pull request replaces an older one.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'masterhost' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # Only for this job: a deploy key that is allowed into the Masterhost account,
      # pinned to the host's known keys. See DEPLOYMENT.md.
      - name: Configure SSH
        if: github.event_name != 'pull_request'
        env:
          MASTERHOST_SSH_KEY: ${{ secrets.MASTERHOST_SSH_KEY }}
          MASTERHOST_KNOWN_HOSTS: ${{ secrets.MASTERHOST_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$MASTERHOST_SSH_KEY" > ~/.ssh/masterhost
          printf '%s\n' "$MASTERHOST_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host masterhost
            HostName u543238.ssh.masterhost.ru
            User u543238
            IdentityFile ~/.ssh/masterhost
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF
          chmod 600 ~/.ssh/masterhost ~/.ssh/known_hosts ~/.ssh/config

      - name: Deploy
        if: github.event_name != 'pull_request'
        env:
          REVISION: ${{ github.sha }}
        run: ops/deploy.sh
